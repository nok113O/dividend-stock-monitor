# 配置先: .github/workflows/daily.yml (コード用 public リポジトリ)
# データは別の private リポジトリ(例: dividend-data)に置き、PAT で読み書きする。
name: daily-price-update

on:
  schedule:
    - cron: "17 8 * * 1-5"   # UTC 08:17 = 日本時間 17:17(大引け後)。平日のみ
  workflow_dispatch:          # スマホから手動実行できる
    inputs:
      baseline:
        description: "初回は true(通知なしで基準を揃える)"
        type: boolean
        default: false
      since:
        description: "取りこぼし回収: この日以降の決算を分析待ちに入れる(例 2026-10-27)。普段は空欄"
        type: string
        default: ""
      test_push:
        description: "true にすると、通知のテストだけ送る(株価更新もする)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: nok113O/dividend-data      # ← 作成した private リポジトリ名に合わせる
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "pandas>=2.2,<3" "numpy>=1.26,<3" "yfinance>=0.2.65,<1" "requests>=2.32,<3"

      - name: Update prices
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}      # 任意。未設定なら通知なし
        run: python daily_update.py --csv data-repo/watchlist.csv --out data-repo ${{ inputs.baseline && '--baseline' || '' }}

      - name: Test push
        if: ${{ inputs.test_push }}
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          k = os.environ.get("BARK_KEY", "").strip()
          if not k:
              raise SystemExit("BARK_KEY が未設定です")
          r = requests.post("https://api.day.app/push", timeout=20, json={
              "device_key": k, "title": "テスト通知", "body": "GitHub Actions から届きました"})
          print("status", r.status_code)
          r.raise_for_status()
          PY

      - name: Detect earnings
        continue-on-error: true                  # 失敗しても株価更新は止めない
        env:
          EDINET_DB_API_KEY: ${{ secrets.EDINET_DB_API_KEY }}   # 未設定ならスキップ
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python earnings_watch.py --csv data-repo/watchlist.csv --out data-repo ${{ inputs.since && format('--since {0}', inputs.since) || '' }}

      - name: Digest earnings
        continue-on-error: true                  # 分析待ちの数字を機械的に集める(1回45銘柄まで)
        env:
          EDINET_DB_API_KEY: ${{ secrets.EDINET_DB_API_KEY }}
        run: python earnings_digest.py --csv data-repo/watchlist.csv --out data-repo --max 45

      - name: Apply dividends
        continue-on-error: true                  # 増配・変化なしの予想配当だけCSVへ反映(減配は人が確認)
        run: python apply_dividends.py --csv data-repo/watchlist.csv --out data-repo

      - name: Commit data
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
